name: Unpack MatrixDrive source

on:
  push:
    paths:
      - ".github/workflows/unpack-project.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract uploaded project
        shell: bash
        run: |
          set -euo pipefail
          unzip -o MatrixDrive_Dual_System_Cart_RevB.zip -d .

      - name: Commit extracted source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Archive was already extracted."
            exit 0
          fi
          git commit -m "Unpack MatrixDrive project source [skip ci]"
          git push
